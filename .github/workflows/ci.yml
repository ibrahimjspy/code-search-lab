name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install lightweight test dependency
        run: python -m pip install numpy==1.26.4
      - name: Install optional TypeScript parser
        run: python setup.py --typescript
      - name: Test retrieval, portability and vector-cache behavior
        run: python -m unittest test_codesearch test_portability test_semantic
      - name: Test TypeScript extraction
        run: npm test
      - name: Run synthetic lexical evaluation
        env:
          CODESEARCH_CACHE_DIR: ${{ runner.temp }}/codesearch-cache
        run: python evaluate.py --lexical-only
